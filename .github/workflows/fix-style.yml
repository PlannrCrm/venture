name: fix-style

on: [push]

jobs:
  cs-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Get branch names
        id: branch-name
        uses: tj-actions/branch-names@b99758d88d96a27ee98b444451c1602a4507d243 # v5.1

      - name: Checkout code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.3

      - name: Install dependencies
        run: composer install

      - name: Fix style
        run: ./vendor/bin/php-cs-fixer fix --allow-risky=yes --using-cache=no

      - name: Commit style fixes
        uses: stefanzweifel/git-auto-commit-action@3ea6ae190baf489ba007f7c92608f33ce20ef04a # v4
        with:
          commit_message: Apply php-cs-fixer changes
